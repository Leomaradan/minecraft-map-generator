pluginManagement {
    plugins {
        // Declared here rather than in the root build so that `-PcoreOnly` builds never resolve them
        // (Loom needs Gradle to run on Java 25).
        // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
        id 'net.fabricmc.fabric-loom' version '1.18.1'
        // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
        id 'net.neoforged.moddev' version '2.0.148'
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'minecraft-map-generator'
includeBuild('build-logic')

// Minecraft version to build: ./gradlew build -Pmc=26.1 (26.2 by default). Its Minecraft and loader
// versions come from versions/<mc>.properties and are set on every project like gradle.properties.
def mc = providers.gradleProperty('mc').getOrElse('26.2')
def versionFile = file("versions/${mc}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Unsupported Minecraft version ${mc}: no ${versionFile.name} in versions/")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
gradle.beforeProject { project ->
    versionProps.each { key, value -> project.ext.set(key, value) }
}

// Minecraft-independent code (map pack parsing, validation, terrain sampling). Builds and tests
// without any Minecraft download: ./gradlew -PcoreOnly :core:test
include('core')
if (!providers.gradleProperty('coreOnly').isPresent()) {
    include('common')
    include('fabric')
    include('neoforge')
}
