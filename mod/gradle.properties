# Every field added here that is used in resources must be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=0.2.0
group=com.leomaradan.mapgen
java_version=25

# Common (the Minecraft version and loader versions are in versions/<mc>.properties)
mod_name=Map Generator
mod_author=Leo Maradan
mod_id=mapgen
license=All-Rights-Reserved
credits=
description=Generates worlds from a predefined map ZIP (heightmap, biome map, water and lava maps, structures).

# Fabric, see https://fabricmc.net/develop/
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_loader_version_range=[4,)

# Core (Minecraft-independent) dependencies. Gson is bundled with Minecraft at runtime.
gson_version=2.13.1
junit_version=5.13.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
