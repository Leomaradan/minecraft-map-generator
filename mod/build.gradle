plugins {
    // see https://plugins.gradle.org/plugin/org.sonarqube for new versions
    id 'org.sonarqube' version '7.5.0.8588'
}

sonar {
    properties {
        property 'sonar.projectKey', 'Leomaradan_minecraft-map-generator'
        property 'sonar.organization', 'leomaradan'
        // Loader and Minecraft glue code needs the game to run: only core is unit tested.
        property 'sonar.coverage.exclusions', 'common/**,fabric/**,neoforge/**'
    }
}
