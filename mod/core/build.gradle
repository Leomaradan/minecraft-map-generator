// Minecraft-independent code: map pack parsing, validation and terrain sampling.
// Its sources are compiled into each loader jar (see multiloader-loader.gradle), like the common project.
plugins {
    id 'java-library'
    id 'jacoco'
}

java {
    // Kept at 21 so the core can be built and tested on machines without a Java 25 toolchain.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly("com.google.code.gson:gson:${gson_version}")
    testImplementation("com.google.code.gson:gson:${gson_version}")
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    finalizedBy(jacocoTestReport)
}

// XML report is picked up by Sonar from its default location (build/reports/jacoco/test/jacocoTestReport.xml).
jacocoTestReport {
    reports {
        xml.required = true
    }
}

configurations {
    coreJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    coreJava sourceSets.main.java.sourceDirectories.singleFile
}
