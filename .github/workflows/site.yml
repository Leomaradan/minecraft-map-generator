name: Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mod/example/*.zip'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mod/example/*.zip'
      - '.github/workflows/site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in site/package.json (packageManager).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: mkdir -p dist/examples && cp ../mod/example/*.zip dist/examples/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
