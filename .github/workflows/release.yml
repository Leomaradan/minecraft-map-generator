name: Release

# Pushing a v* tag builds the mod and creates a GitHub release with the Fabric and NeoForge
# mod jars (no sources or javadoc jars) and the example map ZIPs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: mod

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the core toolchain, 25 (last = default) for Minecraft and to run Gradle.
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mod

      - name: Build and test
        run: ./gradlew build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never interpolated into the script, so a tag name
          # cannot inject shell commands.
          TAG: ${{ github.ref_name }}
        run: |
          jars=$(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar | grep -vE -- '-(sources|javadoc)\.jar$')
          gh release create "$TAG" --generate-notes $jars example/*.zip
