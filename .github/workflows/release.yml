name: Release

# Pushing a v* tag on the mc/26.1-26.2 branch (for example v1.0.1-mc26.1-26.2) builds the mod for
# Minecraft 26.1 and 26.2 and publishes it with mc-publish:
# - CurseForge and Modrinth: one version per Minecraft version and loader (Fabric, also marked for
#   Quilt, and NeoForge), with the mod jar only (no sources or javadoc jars);
# - GitHub: one release with the four jars and the example map ZIPs.
#
# The tag must be v<version>-mc26.1-26.2, with `version` from mod/gradle.properties. Versions with
# alpha, beta or rc in their name are published as alpha or beta versions and GitHub prereleases.
#
# Repository settings (shared with main):
# - variables CURSEFORGE_PROJECT_ID and MODRINTH_PROJECT_ID: the project IDs on each platform;
# - secrets CURSEFORGE_TOKEN and MODRINTH_TOKEN: API tokens allowed to upload versions.
# A platform whose token is not set is skipped.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: mod

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the core toolchain, 25 (last = default) for Minecraft and to run Gradle.
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mod

      # The tag name is passed through the environment, never interpolated into a script, so it
      # cannot inject shell commands. Outputs for a Minecraft version use _ for its dot (26_1).
      - name: Read the mod metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prop() { sed -n "s/^$1=//p" "$2"; }
          version=$(prop version gradle.properties)
          if [ "$TAG" != "v$version-mc26.1-26.2" ]; then
            echo "::error::Tag $TAG does not match version=$version in mod/gradle.properties (expected v$version-mc26.1-26.2)"
            exit 1
          fi
          case "$version" in
            *alpha*) type=alpha ;;
            *beta*|*rc*) type=beta ;;
            *) type=release ;;
          esac
          {
            echo "name=$(prop mod_name gradle.properties)"
            echo "mod-id=$(prop mod_id gradle.properties)"
            echo "version=$version"
            echo "type=$type"
            for mc in 26.1 26.2; do
              echo "game-versions-${mc/./_}=$(prop minecraft_version_range "versions/$mc.properties" | tr -d ' ')"
            done
          } >> "$GITHUB_OUTPUT"

      # Both builds write to the same build/libs folders: jar names include the Minecraft version.
      - name: Build and test (26.1)
        run: ./gradlew build -Pmc=26.1

      - name: Build and test (26.2)
        run: ./gradlew build -Pmc=26.2

      # One changelog for every platform: GitHub's notes for the commits since the previous tag.
      - name: Write the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # mod/build is not created by the build (outputs go to each subproject), so make it first.
        run: |
          mkdir -p build
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > build/changelog.md

      # Creates the GitHub release; the next steps add their files to it.
      - name: Publish for Fabric 26.1
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ github.token }}
          github-name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for Minecraft 26.1 and 26.2
          files: mod/fabric/build/libs/${{ steps.meta.outputs.mod-id }}-fabric-26.1-!(*-@(sources|javadoc)).jar
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for Fabric 26.1
          version: ${{ steps.meta.outputs.version }}+26.1-fabric
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: mod/build/changelog.md
          loaders: |
            fabric
            quilt
          game-versions: ${{ steps.meta.outputs.game-versions-26_1 }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}

      - name: Publish for NeoForge 26.1
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ github.token }}
          github-name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for Minecraft 26.1 and 26.2
          files: mod/neoforge/build/libs/${{ steps.meta.outputs.mod-id }}-neoforge-26.1-!(*-@(sources|javadoc)).jar
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for NeoForge 26.1
          version: ${{ steps.meta.outputs.version }}+26.1-neoforge
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: mod/build/changelog.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.game-versions-26_1 }}

      - name: Publish for Fabric 26.2
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ github.token }}
          github-name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for Minecraft 26.1 and 26.2
          files: mod/fabric/build/libs/${{ steps.meta.outputs.mod-id }}-fabric-26.2-!(*-@(sources|javadoc)).jar
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for Fabric 26.2
          version: ${{ steps.meta.outputs.version }}+26.2-fabric
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: mod/build/changelog.md
          loaders: |
            fabric
            quilt
          game-versions: ${{ steps.meta.outputs.game-versions-26_2 }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}

      - name: Publish for NeoForge 26.2
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ github.token }}
          github-name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for Minecraft 26.1 and 26.2
          files: mod/neoforge/build/libs/${{ steps.meta.outputs.mod-id }}-neoforge-26.2-!(*-@(sources|javadoc)).jar
          github-files: |
            mod/neoforge/build/libs/${{ steps.meta.outputs.mod-id }}-neoforge-26.2-!(*-@(sources|javadoc)).jar
            mod/example/*.zip
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} for NeoForge 26.2
          version: ${{ steps.meta.outputs.version }}+26.2-neoforge
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: mod/build/changelog.md
          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.game-versions-26_2 }}
