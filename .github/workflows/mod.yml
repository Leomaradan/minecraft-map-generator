name: Minecraft mod

# Builds the mod for Minecraft 26.1 and 26.2 on every change under mod/ and publishes one artifact
# per Minecraft version and mod loader, each containing only the mod jar (no sources or javadoc jars).

on:
  push:
    branches:
      - mc/26.1-26.2
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
  pull_request:
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mod

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each version has its loader versions in mod/versions/<mc>.properties.
        mc: ['26.1', '26.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 for the core toolchain, 25 (last = default) for Minecraft and to run Gradle.
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mod

      - name: Read mod properties
        id: mod
        run: echo "mod_id=$(sed -n 's/^mod_id=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.mod_id }}-fabric-${{ matrix.mc }}
          path: |
            mod/fabric/build/libs/*.jar
            !mod/fabric/build/libs/*-sources.jar
            !mod/fabric/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.mod_id }}-neoforge-${{ matrix.mc }}
          path: |
            mod/neoforge/build/libs/*.jar
            !mod/neoforge/build/libs/*-sources.jar
            !mod/neoforge/build/libs/*-javadoc.jar
          if-no-files-found: error
